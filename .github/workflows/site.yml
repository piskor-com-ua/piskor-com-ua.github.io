name: Site
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'
permissions:
  contents: read
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    name: Validate site
    # Ruby 4.0.1 is published for this image; ubuntu-latest moved to 26.04
    # before ruby-builder supplied a matching binary (main run 39929321907).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check conventional PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PYCODE'
          import os, re
          assert re.match(r'^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: .+', os.environ['PR_TITLE']), 'Use a Conventional Commit PR title'
          PYCODE
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install pinned build and validation tools
        run: npm ci --ignore-scripts
      - name: Validate JavaScript
        run: |
          for file in concept/*.js; do node --check "$file"; done
      - name: Set up Ruby and locked gems
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          bundler-cache: true
      - name: Install image build dependency
        run: python3 -m pip install -r requirements-build.txt
      - name: Validate agent tools
        run: node --test scripts/test-agent-tools.js scripts/test-prerender-home.cjs scripts/test-zabava-gallery-delivery.mjs scripts/test-deferred-mobile-media.mjs
      - name: Restore content-addressed image encodings
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: output/image-cache
          key: avif-v1-${{ runner.os }}-${{ hashFiles('requirements-build.txt', 'scripts/prepare_public_assets.py', 'concept/assets/**/*.webp') }}
          restore-keys: avif-v1-${{ runner.os }}-
      - name: Build and check public artifact
        run: python3 scripts/build-site.py
      - name: Validate public API/discovery artifact and Origin Trial renewal
        run: python3 scripts/check_agent_api.py --site _site --revision "$GITHUB_SHA" --out output/agent-api-gate
      - name: Build and validate the matching Markdown Worker
        run: |
          python3 scripts/build_markdown_worker.py --site _site --out output/markdown-worker --revision "$GITHUB_SHA"
          node --test scripts/test-markdown-worker.mjs
      - name: Install browser validation tools
        run: |
          npx playwright install --with-deps chromium
      - name: Validate HTTP MCP transport and real SDK client
        run: npm run test:mcp
      - name: Check every project on desktop and mobile
        run: npm run test:browser
      - name: Validate ARD and WebMCP schemas
        run: npm run test:discovery
      - name: Save Markdown Worker deployment bundle
        if: github.event_name != 'schedule'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: markdown-worker
          path: output/markdown-worker
          retention-days: 7
      - name: Save agent API verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-api-verification
          path: output/agent-api-gate
          retention-days: 7
      - name: Save cache coverage and exact release invalidation plan
        if: github.event_name != 'schedule'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cache-policy
          path: output/cache-policy
          retention-days: 30
      - name: Save browser verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-verification
          path: output/browser
          retention-days: 7
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload site
        if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true
  deploy:
    name: Deploy Pages
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

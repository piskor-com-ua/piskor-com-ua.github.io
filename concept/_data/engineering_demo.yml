  - {id: living-evening, image: /assets/engineering-demo/living-evening}
  - {id: living-curtains-closed, image: /assets/engineering-demo/living-curtains-closed}
  - {id: living-door-open, image: /assets/engineering-demo/living-door-open}
  - {id: heating-detail, image: /assets/engineering-demo/heating-detail}

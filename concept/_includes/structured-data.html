{% assign structured_path = page.redirect_to | default: page.url %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": {{ '/#organization' | absolute_url | jsonify }},
      "name": "PISKOR Architect",
      "url": {{ '/' | absolute_url | jsonify }},
      "logo": {{ '/assets/piskor-logo.png' | absolute_url | jsonify }},
      "telephone": "+380974781005",
      "email": "info@piskor.com.ua",
      "sameAs": ["https://www.instagram.com/piskor.com.ua/", "https://www.behance.net/piskor_com_ua", "https://www.facebook.com/piskor.com.ua/"]
    },
    {
      "@type": "WebSite",
      "@id": {{ '/#website' | absolute_url | jsonify }},
      "name": "PISKOR Architect",
      "url": {{ '/' | absolute_url | jsonify }},
      "inLanguage": ["uk", "en"],
      "publisher": {"@id": {{ '/#organization' | absolute_url | jsonify }}}
    }
    {% if page.not_found %},
    {
      "@type": "WebPage",
      "@id": {{ page.url | absolute_url | jsonify }},
      "url": {{ page.url | absolute_url | jsonify }},
      "name": {{ page.title | jsonify }},
      "inLanguage": {{ page.lang | jsonify }},
      "isPartOf": {"@id": {{ '/#website' | absolute_url | jsonify }}}
    }
    {% elsif page.home != true %},
    {% if page.service %}
    {
      "@type": "Service",
      "@id": {{ page.url | absolute_url | append: '#service' | jsonify }},
      "url": {{ page.url | absolute_url | jsonify }},
      "name": {{ page.title | jsonify }},
      "description": {{ page.description | jsonify }},
      "serviceType": {% if page.lang == 'en' %}"Building and smart-home automation planning"{% else %}"Проєктування інженерної та розумної автоматизації"{% endif %},
      "inLanguage": {{ page.lang | jsonify }},
      "provider": {"@id": {{ '/#organization' | absolute_url | jsonify }}}
    },
    {% elsif page.catalog %}
    {
      "@type": "CollectionPage",
      "@id": {{ page.url | absolute_url | jsonify }},
      "url": {{ page.url | absolute_url | jsonify }},
      "name": {{ page.title | jsonify }},
      "inLanguage": {{ page.lang | jsonify }},
      "mainEntity": {"@type": "ItemList", "itemListElement": [
        {% include portfolio-projects.html %}
        {% if page.year %}{% assign projects = projects | where: 'project_year', page.year %}{% endif %}
        {% for project in projects %}{% unless forloop.first %},{% endunless %}
        {"@type":"ListItem", "position":{{ forloop.index }}, "name":{{ project.card_title | jsonify }}, "url":{{ project.url | absolute_url | jsonify }}}
        {% endfor %}
      ]}
    },
    {% else %}
    {
      "@type": "CreativeWork",
      "@id": {{ structured_path | absolute_url | append: '#project' | jsonify }},
      "url": {{ structured_path | absolute_url | jsonify }},
      "name": {{ page.title | jsonify }},
      "description": {{ page.description | jsonify }},
      "inLanguage": {{ page.lang | jsonify }},
      "creator": {"@id": {{ '/#organization' | absolute_url | jsonify }}},
      "genre": "Interior design"{% if page.content_location %},
      "contentLocation": {"@type": "Place", "name": {{ page.content_location | jsonify }} }{% endif %}
    },
    {% endif %}
    {
      "@type": "BreadcrumbList",
      "itemListElement": [
        {"@type": "ListItem", "position": 1, "name": {% if page.lang == 'en' %}"Home"{% else %}"Головна"{% endif %}, "item": {% if page.lang == 'en' %}{{ '/en/' | absolute_url | jsonify }}{% else %}{{ '/' | absolute_url | jsonify }}{% endif %}},
        {"@type": "ListItem", "position": 2, "name": {% if page.service %}{% if page.lang == 'en' %}"Engineering automation"{% else %}"Інженерна автоматизація"{% endif %}, "item": {{ page.url | absolute_url | jsonify }}{% else %}{% if page.lang == 'en' %}"Portfolio"{% else %}"Портфоліо"{% endif %}, "item": {% if page.lang == 'en' %}{{ '/en/portfolio/' | absolute_url | jsonify }}{% else %}{{ '/portfolio/' | absolute_url | jsonify }}{% endif %}{% endif %}}
        {% unless page.catalog or page.service %},
        {"@type": "ListItem", "position": 3, "name": {{ page.card_title | default: page.title | jsonify }}, "item": {{ structured_path | absolute_url | jsonify }}}
        {% endunless %}
      ]
    }
    {% endif %}
    {% for video in page.video_seo %}{% if video.upload_date %},
    {
      "@type": "VideoObject",
      "@id": {{ page.url | absolute_url | append: '#video-' | append: forloop.index | jsonify }},
      "name": {{ video.title | jsonify }},
      "description": {{ video.description | jsonify }},
      "thumbnailUrl": {{ video.thumbnail | absolute_url | jsonify }},
      "contentUrl": {{ video.content | absolute_url | jsonify }},
      "uploadDate": {{ video.upload_date | jsonify }},
      "inLanguage": {{ page.lang | jsonify }},
      "mainEntityOfPage": {{ page.url | absolute_url | jsonify }},
      "publisher": {"@id": {{ '/#organization' | absolute_url | jsonify }}}
    }
    {% endif %}{% endfor %}
  ]
}
</script>
